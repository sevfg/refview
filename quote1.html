<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Reflectie</title>

    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100svh;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
            color: #ffffff;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        .quote-container {
            margin-bottom: 50px;
            opacity: 0;
            transform: scale(0.95);
            animation: fadeInBlur 2.5s ease-out forwards;
        }

        .quote-mark {
            font-size: clamp(3rem, 8vw, 5rem);
            color: rgba(255, 255, 255, 0.1);
            font-family: 'Georgia', serif;
            line-height: 0;
        }

        h1 {
            font-size: clamp(1.2rem, 4.5vw, 2.2rem);
            font-weight: 300;
            font-style: italic;
            line-height: 1.7;
            color: #e0e0e0;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            margin: 10px 0;
        }

        .highlight {
            color: #f1c40f;
            font-weight: 500;
        }

        hr {
            width: 50px;
            border: 0;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            margin: 25px auto;
        }

        .subtext {
            font-size: clamp(0.9rem, 3.5vw, 1.1rem);
            color: #888;
            margin-bottom: 35px;
            letter-spacing: 1px;
            text-transform: uppercase;
            animation: fadeIn 4s ease-in;
        }

        button {
            width: 100%;
            max-width: 320px;
            padding: 18px;
            font-size: 1rem;
            background: transparent;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeIn 2s ease-in 2s forwards;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover {
            background: white;
            color: black;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }

        button:active {
            transform: scale(0.97);
        }

        @keyframes fadeInBlur {
            0% { opacity: 0; filter: blur(10px); transform: scale(0.95); }
            100% { opacity: 1; filter: blur(0); transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .glow {
            position: fixed;
            top: 50%;
            left: 50%;
            width: min(90vw, 400px);
            height: min(90vw, 400px);
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, rgba(0, 0, 0, 0) 70%);
            transform: translate(-50%, -50%);
            z-index: -1;
        }
    </style>

    <link rel="prefetch" href="video2.mp4" as="video">
<link rel="prefetch" href="video3.mp4" as="video">

</head>
<body>

    <div class="glow"></div>

    <div class="container">
        <div class="quote-container">
            <div class="quote-mark">“</div>

            <h1>
                "Mensen vergeten dat ik in een fractie van een seconde moet beslissen, zonder herhalingen.
                <span class="highlight">Ik accepteer mijn fouten</span>, maar het respect hoort nooit te verdwijnen."
            </h1>

            <div class="quote-mark" style="text-align: right;">”</div>
        </div>

        <hr>
        <p class="subtext">Respect is de basis van het spel</p>

        <button onclick="window.location.href='vraag2.html'">Volgende Situatie</button>

     
    </div>

    <script data-goatcounter="https://nicusor.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

</body>
</html>
