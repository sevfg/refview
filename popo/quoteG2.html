<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Reflectie - Vakmanschap</title>

    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100svh; /* beter dan 100vh op mobiel */
            background: radial-gradient(circle at center, #064e3b 0%, #000000 100%);
            background-attachment: fixed;
            color: #ffffff;
        }

        .container {
            max-width: 850px;
            width: 100%;
            padding: 40px 25px;
            border-radius: 24px;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(46, 204, 113, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeInSlide 1.2s ease-out forwards;
        }

        .quote-icon {
            font-size: clamp(2rem, 6vw, 3rem);
            color: #2ecc71;
            margin-bottom: 15px;
            opacity: 0.8;
        }

        h1 {
            font-size: clamp(1.2rem, 4.5vw, 2rem);
            line-height: 1.7;
            font-weight: 300;
            font-style: italic;
            color: #f0fdf4;
            margin-bottom: 25px;
        }

        .highlight {
            color: #2ecc71;
            font-weight: 600;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: #2ecc71;
            margin: 25px auto;
            opacity: 0.5;
        }

        .subtext {
            font-size: clamp(0.9rem, 3.5vw, 1.2rem);
            letter-spacing: clamp(1px, 1vw, 3px);
            text-transform: uppercase;
            color: #ffffff;
            font-weight: 700;
            margin-bottom: 35px;
        }

        button {
            width: 100%;
            max-width: 320px;
            padding: 18px;
            font-size: 1rem;
            border-radius: 14px;
            border: none;
            background: #27ae60;
            color: white;
            cursor: pointer;
            transition: all 0.25s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            box-shadow: 0 10px 20px rgba(0,0,0,0.25);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover {
            background: #2ecc71;
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(46, 204, 113, 0.3);
        }

        button:active {
            transform: scale(0.98);
        }

        @keyframes fadeInSlide {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="quote-icon">“</div>
        <h1>
            "Niets voelt beter dan een wedstrijd waarin de focus op het voetbal ligt, omdat de beslissingen worden<span class="highlight"> gerespecteerd.</span> 
            
        </h1>

           <div class="divider"></div>

        <p class="subtext">Respect is de basis van het spel</p>

        <button onclick="window.location.href='vraag2.html'">Volgende Situatie</button>
    </div>

    <script data-goatcounter="https://nicusor.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

</body>
</html>
